name: Perbarui cuaca
on:
  schedule:
    - cron: "7 10,22 * * *"  # 2x sehari: 17.07 dan 05.07 WIB (10.07 dan 22.07 UTC)
  workflow_dispatch:
  push:                      # jalan sekali segera setelah skrip/workflow ini di-upload
    paths:
      - "scripts/ambil-cuaca.js"
      - ".github/workflows/cuaca.yml"
permissions:
  contents: write
concurrency:
  group: cuaca
  cancel-in-progress: false
jobs:
  ambil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/ambil-cuaca.js
      - name: Commit jika berubah
        run: |
          git config user.name "cuaca-bot"
          git config user.email "cuaca-bot@users.noreply.github.com"
          git add cuaca.json
          git diff --cached --quiet || (git commit -m "Perbarui cuaca" && git push)
