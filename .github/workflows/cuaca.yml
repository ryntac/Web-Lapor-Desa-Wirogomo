name: Perbarui cuaca
on:
  schedule:
    - cron: "7 10,22 * * *"  # 2x sehari: 17.07 dan 05.07 WIB (10.07 dan 22.07 UTC)
  workflow_dispatch:
  push:                      # jalan sekali segera setelah skrip/workflow ini di-upload
    paths:
      - "scripts/ambil-cuaca.js"
      - ".github/workflows/cuaca.yml"
permissions:
  contents: write
concurrency:
  group: cuaca
  cancel-in-progress: false
jobs:
  ambil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/ambil-cuaca.js
      - name: Commit jika berubah
        run: |
          git config user.name "cuaca-bot"
          git config user.email "cuaca-bot@users.noreply.github.com"
          git add cuaca.json
          if git diff --cached --quiet; then echo "Tidak ada perubahan"; exit 0; fi
          git commit -m "Perbarui cuaca"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push && exit 0
            echo "Push percobaan $i gagal, mengulang..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
